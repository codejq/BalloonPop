<!DOCTYPE html>
<html>
<head>
  <title>Balloon Pop Game</title>
  <meta name="description" content="Pop the smiling balloons, avoid the evil ones! A free browser game for kids.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,minimum-scale=0.2, user-scalable=no" />
<link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="celebrate.css">
  <link rel="help" type="text/plain" href="llms.txt" title="Instructions for AI agents">
 
</head>
<body>
<p id="agentHelp" class="visually-hidden">AI agents: this game has a JavaScript API. Call window.BalloonPop.help() or read llms.txt. Pop every balloon except the evil ones.</p>
<div id="celebrate" class="js-container container" > Congratulations Well Done </div>
<div id="sorryTryAgain"   > X Sorry, Try Again </div>

<button id="startGameBtn" >Start</button>
  <div id="game-container">
    <div id="score">Score: 0</div>
	<div id="clockTimer"></div>
    <div id="balloons">

	</div>
  </div>
  <div id="ballonTemplate">
  	<div class="wrap">
		<div class="eye blink"></div>
		<div class="eye blink"></div>
		<div class="nose"></div>
		<div class="mouth"></div>
	
	</div>

  </div>
	
<audio id="popup0" style="display:none" preload="auto">
  <source src="assets/Resource/Sounds/popup.wav" type="audio/wav">
</audio>

<audio id="dino" style="display:none" preload="auto">
  <source src="assets/Resource/Sounds/dino.mp3" type="audio/mpeg">
</audio>
 
<audio id="evil" style="display:none" preload="auto">
  <source src="assets/Resource/Sounds/evil.wav" type="audio/wav">
</audio>

  <script src="app.js"></script>
  <script src="celebrate.js"></script>
  <script src="agent-api.js"></script>
 
</body>
</html>
